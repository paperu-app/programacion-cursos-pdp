<script>
// URL del flujo de Power Automate "PDP_Login" — dispara la validación de correo+PIN contra USUARIOS_PDP
const LOGIN_FLOW_URL = 'https://default24c2e1716e8e4193b3b6fc1b6bb306.bb.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/27/workflows/9b9edd7f91be4e789e997d7b10dd860f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=saIf-9pB5puHEZvRQGi8ryqYUPm-9xaB7zC_uFt6zHc';

function getSharePointUserEmail(){
  // Cuando el archivo está embebido en una página de SharePoint, este objeto global
  // trae el correo de quien ya inició sesión en el sitio.
  return (typeof _spPageContextInfo !== 'undefined' && _spPageContextInfo.userEmail) ? _spPageContextInfo.userEmail : '';
}

// ---- Utilidades de fecha compartidas por analista-app y coordinador-app -------------------------
// Se usan para que el widget "Corte semanal" y el calendario del panel de Inicio siempre reflejen
// la fecha real del navegador (hoy, no una fecha fija), sin depender de datos de SharePoint.
const MESES_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Próximo corte semanal (miércoles 18:00), con la misma regla que "PDC-01 Crear solicitud PDP":
// si hoy es miércoles y aún no son las 18:00, el corte es hoy mismo; si no, es el miércoles siguiente.
function nextWeeklyCutoff(now){
  now = now || new Date();
  const day = now.getDay(); // 0=domingo … 3=miércoles … 6=sábado
  let diffDays = (3 - day + 7) % 7;
  if(diffDays === 0 && now.getHours() >= 18){ diffDays = 7; }
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffDays, 18, 0, 0, 0);
}

// "Hoy" / "Mañana" / "En N días" hasta una fecha objetivo, comparando solo por día calendario
function daysUntilLabel(targetDate, now){
  now = now || new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
  const dias = Math.round((b - a) / 86400000);
  if(dias <= 0) return 'Hoy';
  if(dias === 1) return 'Mañana';
  return `En ${dias} días`;
}

function formatCutoffLabel(cutoffDate){
  return `Miér ${cutoffDate.getDate()} ${MESES_ABBR[cutoffDate.getMonth()]}`;
}

// Convierte "dd/mm/aaaa" a {d,m,y} (m en base 0). Devuelve null si el formato no calza.
function parseDDMMYYYY(str){
  const parts = String(str||'').split('/');
  if(parts.length !== 3) return null;
  const d = Number(parts[0]), m = Number(parts[1]) - 1, y = Number(parts[2]);
  if(!Number.isFinite(d) || !Number.isFinite(m) || !Number.isFinite(y)) return null;
  return {d, m, y};
}

// Cierra la sesión actual: los datos de sesión y de la solicitud en curso viven solo en memoria,
// así que recargar la página basta para volver limpio a la pantalla de PIN. (El único dato que persiste
// en el navegador es el caché de personal/cursos en localStorage, que no es sensible y solo sirve para
// que la siguiente carga sea más rápida — ver PERSONAL_CACHE_KEY / CURSOS_CACHE_KEY.)
function logoutApp(){
  if(confirm('¿Seguro que deseas cerrar sesión?')){
    location.reload();
  }
}

function switchRole(role){
  document.querySelector('analista-app').style.display = role==='analista' ? '' : 'none';
  document.querySelector('coordinador-app').style.display = role==='coordinador' ? '' : 'none';
  document.querySelectorAll('.role-switcher button').forEach(b=>{
    const active = b.dataset.role === role;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  window.scrollTo(0,0);
}

function onLoginSuccess(data){
  document.getElementById('login-screen').style.display = 'none';
  window.PDP_CURRENT_USER = data; // datos reales de sesión, disponibles para analista-app / coordinador-app
  const rol = (data.rol || '').trim().toLowerCase();
  // Cada usuario entra directo a la vista que le corresponde según su Rol real en USUARIOS_PDP;
  // el selector de vistas queda oculto para no dejar que alguien entre a un rol que no es el suyo.
  if(rol === 'coordinador'){
    document.querySelector('coordinador-app').style.display = '';
    document.querySelector('analista-app').style.display = 'none';
    if(window.CoordinadorApp && window.CoordinadorApp.onSessionReady) window.CoordinadorApp.onSessionReady(data);
  } else {
    document.querySelector('analista-app').style.display = '';
    document.querySelector('coordinador-app').style.display = 'none';
    if(window.AnalistaApp && window.AnalistaApp.onSessionReady) window.AnalistaApp.onSessionReady(data);
  }
  window.scrollTo(0,0);
}

async function doLogin(ev){
  ev.preventDefault();
  const correoEl = document.getElementById('login-correo');
  const pinEl = document.getElementById('login-pin');
  const errEl = document.getElementById('login-error');
  const btnEl = document.getElementById('login-btn');
  const correo = correoEl.value.trim();
  const pin = pinEl.value.trim();

  errEl.style.display = 'none';
  if(!correo || !pin){
    errEl.textContent = 'Ingresa tu correo y tu PIN.';
    errEl.style.display = 'block';
    return;
  }

  btnEl.disabled = true;
  btnEl.textContent = 'Ingresando...';
  try{
    const resp = await fetch(LOGIN_FLOW_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({correo, pin})
    });
    const data = await resp.json();
    if(data && data.ok){
      onLoginSuccess(data);
    } else {
      errEl.textContent = (data && data.mensaje) ? data.mensaje : 'Correo o PIN incorrectos.';
      errEl.style.display = 'block';
    }
  } catch(err){
    errEl.textContent = 'No se pudo conectar con el flujo de acceso. Intenta nuevamente.';
    errEl.style.display = 'block';
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = 'Ingresar';
  }
}

document.getElementById('login-form').addEventListener('submit', doLogin);

(function initLoginScreen(){
  const correoEl = document.getElementById('login-correo');
  const auto = getSharePointUserEmail();
  if(auto){
    correoEl.value = auto;
    correoEl.readOnly = true;
  }
  document.getElementById('login-pin').focus();
})();

        const CREAR_SOLICITUD_FLOW_URL = 'https://default24c2e1716e8e4193b3b6fc1b6bb306.bb.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/6a199e5495884324bb7846f678987a04/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wc5fjWzGgBiixQjDtXf_MjSChR2r7YjtI89EuQnM00g';

        // Buscar personal PDP — trae todos los colaboradores activos de PERSONAL_CURSOS_PDP

        const BUSCAR_CURSOS_FLOW_URL = 'https://default24c2e1716e8e4193b3b6fc1b6bb306.bb.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/8db445e8e2dd4671801b030a791101e2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=zi9PhFxfJkG6PZx4aoifz2TF5_WKzjHUUmmVTOqpV0E';

        // Cache local (localStorage) para que el personal y los cursos aparezcan al instante en cargas
        // posteriores mientras se refrescan en segundo plano ("stale-while-revalidate"). No requiere
        // cambios en los flujos: solo evita esperar la respuesta de Power Automate cada vez.
        const PERSONAL_CACHE_KEY = 'pdp_personal_cache_v1';

        function readCache(key){
          try{
            const raw = localStorage.getItem(key);
            if(!raw) return null;
            const parsed = JSON.parse(raw);
            if(!parsed || typeof parsed.timestamp !== 'number') return null;
            if(Date.now() - parsed.timestamp > CACHE_TTL_MS) return null;
            return parsed;
          }catch(err){ return null; }
        }
        function writeCache(key, payload){

          catch(err){ /* localStorage puede fallar en modo privado; no es crítico */ }
        }

        // Separa un texto de áreas ("EBT, GYE" o similar) en una lista de códigos individuales
        function parseAreas(str){
          if(!str) return [];

        }

        // Trae el personal real y lo filtra por la(s) área(s) asignada(s) al analista logueado
        async function loadPersonal(){
          // Fast path: si hay un caché reciente para este mismo analista (mismo correo y áreas),
          // lo mostramos de inmediato mientras se refresca en segundo plano más abajo.
          const cached = readCache(PERSONAL_CACHE_KEY);
          const cacheMatchesUser = cached && cached.correo === CURRENT_USER.correo && cached.areasAsignadas === CURRENT_USER.areasAsignadas;
          if(cacheMatchesUser){
            WORKERS = cached.workers || [];
            recomputeActiveWorkers();

          try{
            const resp = await fetch(BUSCAR_PERSONAL_FLOW_URL, {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({})

            const data = await resp.json();
            if(!Array.isArray(data)) throw new Error('Respuesta inesperada de Buscar personal PDP');
            // Normaliza (recorta espacios y sube a mayúsculas) para que no falle la comparación
            // por espacios ocultos o diferencias de mayúsculas/minúsculas entre ambas listas.
            const normArea = a => String(a || '').trim().toUpperCase();
            const misAreas = parseAreas(CURRENT_USER.areasAsignadas).map(normArea);
            console.log('[Buscar personal] colaboradores recibidos del flujo:', data.length, data.slice(0,3));
            console.log('[Buscar personal] CURRENT_USER.areasAsignadas:', JSON.stringify(CURRENT_USER.areasAsignadas), '→ misAreas:', misAreas);
            console.log('[Buscar personal] áreas distintas recibidas (en crudo):', [...new Set(data.map(w => JSON.stringify(w.area)))]);
            WORKERS = data

              .map(w => ({
                dni: String(w.dni || ''),

                apMaterno: w.apMaterno || '',

        // Trae el catálogo real de cursos desde el flujo "Buscar cursos PDP" y deriva los programas agrupando por esa columna

        function normalizeEstado(raw){
          const s = String(raw||'').trim().toLowerCase();
          if(s.startsWith('valid')) return 'validada';
          if(s.startsWith('rechaz')) return 'rechazada';
          if(s.startsWith('pend')) return 'pendiente';
          console.warn('[Buscar mis solicitudes] Estado no reconocido, se muestra como pendiente:', raw);

        function refreshHeroStats(){

          if(elCorteActivas) elCorteActivas.textContent = activas;
        }

        function normalize(str){ return str.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

        function workerBadge(w){
          return (w.empresa && w.empresa.toUpperCase()!=='PA PERU' && w.empresa.toUpperCase()!=='PA PERÚ')
            ? `<span class="opt-badge" title="${w.empresa}">${w.tipoPersonal || w.empresa}</span>` : '';
        }
        function workerRow(w, selected){
          return `
            <div class="opt-row ${selected?'selected':''}" role="button" tabindex="0" aria-pressed="${selected}" onkeydown="AnalistaApp.rowKey(event)" onclick="AnalistaApp.selectWorker('${w.dni}')">
              <div class="opt-check"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></div>
              <div class="opt-dni mono">${w.dni}</div>
              <div class="opt-main">
                <div class="opt-title">${fullName(w)}${workerBadge(w)}</div>
              </div>
              <div class="opt-area">${w.area}</div>
              <div class="opt-tag">${w.cargo}</div>
            </div>
          `;
        }

        function renderWorkers(){
          const q = normalize(root.getElementById('dni-search').value||'');
          const list = root.getElementById('worker-list');
          if(!personalLoaded){
            root.getElementById('dni-meta').textContent = 'Cargando colaboradores...';
            if(q) list.innerHTML = `<div class="placeholder-row">Cargando colaboradores...</div>`;
            else list.innerHTML = `<div class="placeholder-row">Escribe el DNI, apellidos o nombres del colaborador para buscarlo.</div>`;
            return;
          }
          // Ya hay un colaborador elegido: mostramos solo a esa persona, no al resto de coincidencias.
          if(state.worker){
            root.getElementById('dni-meta').textContent = 'Colaborador seleccionado';
            list.innerHTML = workerRow(state.worker, true) + `<div class="selected-hint">Vuelve a hacer clic para cambiar de colaborador.</div>`;
            return;
          }
          if(!q){
            root.getElementById('dni-meta').textContent = `${ACTIVE_WORKERS.length} colaboradores de tu área`;
            list.innerHTML = `<div class="placeholder-row">Escribe el DNI, apellidos o nombres del colaborador para buscarlo.</div>`;
            return;
          }
          const filtered = ACTIVE_WORKERS.filter(w =>
            w.dni.includes(q) ||
            normalize(fullName(w)).includes(q) ||
            normalize(w.apPaterno).includes(q) ||
            normalize(w.apMaterno).includes(q)
          );
          root.getElementById('dni-meta').textContent = `${filtered.length} de ${ACTIVE_WORKERS.length} colaboradores de tu área`;
          if(!filtered.length){ list.innerHTML = `<div class="placeholder-row">No se encontraron colaboradores con ese criterio.</div>`; return; }
          list.innerHTML = filtered.map(w => workerRow(w, false)).join('');
        }

        function selectWorker(dni){
          if(state.worker && state.worker.dni === dni){
            // Clic de nuevo sobre el ya seleccionado: lo deseleccionamos y mostramos la búsqueda otra vez.
            state.worker = null;
            state.programa = null;
            state.cursos = [];
            root.getElementById('step-programa').classList.add('locked');
            root.getElementById('step-curso').classList.add('locked');
            root.getElementById('step-fecha').classList.add('locked');
            root.getElementById('programa-list').innerHTML = '';
            root.getElementById('curso-list').innerHTML = '';
            renderWorkers();
            updateSummary();
            return;
          }
          state.worker = ACTIVE_WORKERS.find(w => w.dni === dni);
          renderWorkers();
          root.getElementById('step-programa').classList.remove('locked');
          renderProgramas();
          updateSummary();
        }

        function renderProgramas(){
          const list = root.getElementById('programa-list');
          if(!cursosLoaded){
            list.innerHTML = `<div class="placeholder-row">Cargando programas...</div>`;
            return;
          }
          if(!PROGRAMAS.length){
            list.innerHTML = `<div class="placeholder-row">No se pudo cargar el catálogo de cursos. Intenta recargar la página.</div>`;
            return;
          }
          list.innerHTML = PROGRAMAS.map(p => `
            <div class="programa-card ${state.programa===p.nombre?'selected':''}" role="button" tabindex="0" aria-pressed="${state.programa===p.nombre}" onkeydown="AnalistaApp.rowKey(event)" onclick="AnalistaApp.selectPrograma('${p.nombre.replace(/'/g,"\\'")}')">
              <div class="opt-check"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></div>
              <div><div class="programa-name">${p.nombre}</div><div class="programa-count">${p.count} cursos disponibles</div></div>
            </div>
          `).join('');
        }

        function selectPrograma(nombre){
          state.programa = nombre; state.cursos = [];
          renderProgramas();
          root.getElementById('step-curso').classList.remove('locked');
          renderCursos();
          updateSummary();
        }

        function renderCursos(){
          const list = root.getElementById('curso-list');
          const cursos = CURSOS.filter(c => c.programa === state.programa);
          list.innerHTML = cursos.map(c => {
            const sel = state.cursos.includes(c.nombreCurso);
            return `
            <div class="opt-row curso-opt ${sel?'selected':''}" role="checkbox" tabindex="0" aria-checked="${sel}" onkeydown="AnalistaApp.rowKey(event)" onclick="AnalistaApp.toggleCurso('${c.nombreCurso.replace(/'/g,"\\'")}')">
              <div class="opt-check"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></div>
              <div class="opt-main"><div class="opt-title">${c.nombreCurso}</div></div>
              <div class="curso-hours mono">${horasLabel(c)}</div>
            </div>
          `;
          }).join('');
          const meta = root.getElementById('curso-meta');
          if(meta){
            meta.textContent = state.cursos.length
              ? `${state.cursos.length} curso${state.cursos.length>1?'s':''} seleccionado${state.cursos.length>1?'s':''}`
              : 'Puedes elegir uno o varios cursos de este programa';
          }
        }

        function toggleCurso(nombre){
          const i = state.cursos.indexOf(nombre);
          if(i >= 0){ state.cursos.splice(i,1); } else { state.cursos.push(nombre); }
          renderCursos();
          if(state.cursos.length){ root.getElementById('step-fecha').classList.remove('locked'); }
          updateSummary();
        }

        function updateSummary(){
          const sw = root.getElementById('sum-worker'), sp = root.getElementById('sum-programa'), sc = root.getElementById('sum-curso'), sf = root.getElementById('sum-fecha');
          const chipList = root.getElementById('curso-chip-list');
          const calloutText = root.getElementById('callout-text');
          if(state.worker){ sw.textContent = `${state.worker.nombre} ${state.worker.apPaterno}`; sw.title = fullName(state.worker); sw.classList.remove('empty'); }
          else { sw.textContent = '—'; sw.removeAttribute('title'); sw.classList.add('empty'); }
          if(state.programa){ sp.textContent = state.programa; sp.classList.remove('empty'); }
          else { sp.textContent = '—'; sp.classList.add('empty'); }

          if(calloutText){
            calloutText.innerHTML = state.worker
              ? `Al enviar, la solicitud entra a la bandeja de <b>${state.worker.coordinador}</b>, coordinador de <b>${state.worker.area}</b>. El corte automático del miércoles solo recoge lo que esté <i>Validado</i>.`
              : `Al enviar, la solicitud entra a la bandeja de tu coordinador. El corte automático del miércoles solo recoge lo que esté <i>Validado</i>.`;
          }

          if(state.cursos.length === 0){
            sc.textContent = '—'; sc.classList.add('empty');
            chipList.innerHTML = '';
          } else if(state.cursos.length === 1){
            sc.textContent = state.cursos[0]; sc.classList.remove('empty');
            chipList.innerHTML = '';
          } else {
            sc.textContent = `${state.cursos.length} cursos`; sc.classList.remove('empty');
            chipList.innerHTML = state.cursos.map(n => `
              <div class="curso-chip">
                <span>${n}</span>
                <button class="curso-chip-remove" type="button" aria-label="Quitar ${n}" onclick="event.stopPropagation(); AnalistaApp.toggleCurso('${n.replace(/'/g,"\\'")}')">
                  <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
                </button>
              </div>
            `).join('');
          }

          const fecha = root.getElementById('fecha-input').value;
          if(fecha){ const [y,m,d] = fecha.split('-'); sf.textContent = `${d}/${m}/${y}`; sf.classList.remove('empty'); }
          else { sf.textContent = '—'; sf.classList.add('empty'); }
          root.getElementById('submit-btn').disabled = !(state.worker && state.programa && state.cursos.length && fecha);
        }

        async function submitSolicitud(){
          const btn = root.getElementById('submit-btn');
          if(btn.disabled) return;
          const fecha = root.getElementById('fecha-input').value; // yyyy-MM-dd
          const [y,m,d] = fecha.split('-');
          const fechaEstimada = `${d}/${m}/${y}`;

          const originalHTML = btn.innerHTML;
          btn.disabled = true;
          btn.textContent = 'Enviando...';

          const payload = {
            dniPersonal: state.worker.dni,
            analistaNombre: CURRENT_USER.nombre,
            cursos: state.cursos,
            fechaEstimada: fecha
          };

          let folios = null;
          try{
            const resp = await fetch(CREAR_SOLICITUD_FLOW_URL, {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify(payload)
            });
            const data = await resp.json().catch(() => null);
            if(data && data.ok === false){
              alert(data.mensaje || 'No se pudo enviar la solicitud. Intenta nuevamente.');
              btn.disabled = false;
              btn.innerHTML = originalHTML;
              return;
            }
            if(data && Array.isArray(data.folios)) folios = data.folios;
          }catch(err){
            alert('No se pudo conectar con el servidor. Verifica tu conexión e intenta nuevamente.');
            btn.disabled = false;
            btn.innerHTML = originalHTML;
            return;
          }

          const base = 150 + Math.floor((state.worker.dni.charCodeAt(0)%40));
          // Solo para el aviso (toast) inmediato: si el flujo no devolvió folios reales, usamos un
          // rótulo provisional. Esto ya NO se guarda en HIST — "Mis solicitudes" se refresca abajo con
          // los datos reales (folio, Fecha_solicitud y Fecha_corte) recién guardados en SharePoint.
          const toastRecords = state.cursos.map((curso, i) => ({
            titulo: (folios && folios[i]) ? folios[i] : 'SOL-2026-0' + (base + i),
            nombreTrabajador: fullName(state.worker),
            area: state.worker.area,
            coordinadorValidador: state.worker.coordinador,
            curso,
          }));
          showToast(toastRecords, state.programa);
          resetFlow(); // ya recalcula btn.disabled correctamente según el formulario (ahora vacío)
          btn.innerHTML = originalHTML; // solo restauramos el ícono + texto del botón, sin tocar su estado disabled
          loadMisSolicitudes(); // trae de SharePoint la(s) solicitud(es) recién creadas con sus datos reales
        }

        let toastTimer = null;
        // Muestra un aviso flotante y no bloqueante en vez de navegar a una página de confirmación aparte,
        // así el analista se queda en "Nueva solicitud" (ya con el formulario limpio) listo para registrar otra.
        function showToast(records, programaNombre){
          const title = root.getElementById('toast-title');
          const desc = root.getElementById('toast-desc');
          const folios = root.getElementById('toast-folios');
          if(records.length <= 1){
            const r = records[0];
            title.textContent = 'Solicitud enviada a validación';
            desc.innerHTML = `Le llegará a <strong>${r.coordinadorValidador}</strong> (coordinador · ${r.area}). Recibirás una notificación cuando se valide o si se rechaza.`;
            folios.innerHTML = `<span class="toast-folio">${r.titulo}</span>`;
          } else {
            const r0 = records[0];
            title.textContent = `${records.length} solicitudes enviadas a validación`;
            desc.innerHTML = `Se generó una solicitud por curso del programa <strong>${programaNombre}</strong> para <strong>${r0.nombreTrabajador}</strong>. Todas le llegarán a ${r0.coordinadorValidador} (coordinador · ${r0.area}).`;
            folios.innerHTML = records.map(r => `<span class="toast-folio">${r.titulo} · ${r.curso}</span>`).join('');
          }
          const toast = root.getElementById('submit-toast');
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(hideToast, 6000);
        }

        function hideToast(){
          const toast = root.getElementById('submit-toast');
          if(toast) toast.classList.remove('show');
          clearTimeout(toastTimer);
        }

        function resetFlow(){
          state = {worker:null, programa:null, cursos:[]};
          root.getElementById('dni-search').value = '';
          root.getElementById('fecha-input').value = '';
          root.getElementById('step-programa').classList.add('locked');
          root.getElementById('step-curso').classList.add('locked');
          root.getElementById('step-fecha').classList.add('locked');
          root.getElementById('programa-list').innerHTML = '';
          root.getElementById('curso-list').innerHTML = '';
          root.getElementById('curso-chip-list').innerHTML = '';
          renderWorkers();
          updateSummary();
        }

        function renderHist(filter){
          const list = root.getElementById('hist-list');
          if(!histLoaded){ list.innerHTML = `<div class="placeholder-row">Cargando tus solicitudes...</div>`; return; }
          const items = filter==='todas' ? HIST : HIST.filter(h => h.estado === filter);
          if(!items.length){ list.innerHTML = `<div class="placeholder-row">No hay solicitudes en este estado.</div>`; return; }
          const pillMap = {pendiente:'pill-amber', validada:'pill-green', rechazada:'pill-red'};
          const labelMap = {pendiente:'Pendiente', validada:'Validada', rechazada:'Rechazada'};
          list.innerHTML = items.map(h => `
            <div class="hist-row">
              <div class="hist-av">${initials(h.nombreTrabajador)}</div>
              <div class="hist-main"><div class="hist-title">${h.nombreTrabajador}</div><div class="hist-sub">${h.curso} · ${h.titulo}</div></div>
              <span class="pill ${pillMap[h.estado]}">${labelMap[h.estado]}</span>
              <div class="hist-date mono">${h.fechaEstimada}</div>
            </div>
          `).join('');
        }

        function filterHist(f, el){
          histFilter = f;
          root.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));
          el.classList.add('active');
          renderHist(f);
        }

        function renderHomeActivity(filter){
          const list = root.getElementById('home-activity-list');
          if(!histLoaded){ list.innerHTML = `<div class="placeholder-row">Cargando actividad reciente...</div>`; return; }
          const items = (filter==='todas' ? HIST : HIST.filter(h => h.estado === filter)).slice(0,4);
          if(!items.length){ list.innerHTML = `<div class="placeholder-row">No hay solicitudes en este estado.</div>`; return; }
          const pillMap = {pendiente:'pill-amber', validada:'pill-green', rechazada:'pill-red'};
          const labelMap = {pendiente:'Pendiente', validada:'Validada', rechazada:'Rechazada'};
          list.innerHTML = items.map(h => `
            <div class="hist-row">
              <div class="hist-av">${initials(h.nombreTrabajador)}</div>
              <div class="hist-main"><div class="hist-title">${h.nombreTrabajador}</div><div class="hist-sub">${h.curso} · ${h.titulo}</div></div>
              <span class="pill ${pillMap[h.estado]}">${labelMap[h.estado]}</span>
              <div class="hist-date mono">${h.fechaEstimada}</div>
            </div>
          `).join('');
        }

        function filterHome(f, el){
          homeFilter = f;
          root.querySelectorAll('.pill-row .pill-filter').forEach(b=>b.classList.remove('active'));
          el.classList.add('active');
          renderHomeActivity(f);
        }

        // Mes que se está mostrando en el calendario (empieza siempre en el mes real de hoy)
        const today0 = new Date();
        let calViewDate = new Date(today0.getFullYear(), today0.getMonth(), 1);

        // Días del mes visible que tienen alguna solicitud registrada (según Fecha estimada en HIST),
        // para pintar el puntito bajo el número. Se recalcula real Fecha_solicitud/estimada del historial.
        function computeMarkedDays(year, month){
          const marked = new Set();
          HIST.forEach(h => {
            const p = parseDDMMYYYY(h.fechaEstimada);
            if(p && p.y === year && p.m === month) marked.add(p.d);
          });
          return marked;
        }

        function changeCalMonth(delta){
          calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() + delta, 1);
          renderCalendar();
        }

        function renderCalendar(){
          const grid = root.getElementById('cal-grid');
          const monthLabel = root.querySelector('#cal-card .cal-month');
          const [prevBtn, nextBtn] = root.querySelectorAll('#cal-card .cal-nav button');
          const now = new Date();
          const year = calViewDate.getFullYear(), month = calViewDate.getMonth();

          if(monthLabel) monthLabel.textContent = `${MESES_FULL[month]} ${year}`;
          if(prevBtn) prevBtn.onclick = () => changeCalMonth(-1);
          if(nextBtn) nextBtn.onclick = () => changeCalMonth(1);

          const marked = computeMarkedDays(year, month);
          const dows = ['L','M','M','J','V','S','D'];
          const firstOfMonth = new Date(year, month, 1);
          // getDay(): 0=domingo..6=sábado → lo convertimos para que la semana empiece en lunes
          const leading = (firstOfMonth.getDay() + 6) % 7;
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const daysInPrevMonth = new Date(year, month, 0).getDate();

          let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
          for(let i=0; i<leading; i++){ html += `<div class="cal-day other">${daysInPrevMonth - leading + 1 + i}</div>`; }
          for(let d=1; d<=daysInMonth; d++){
            const cls = ['cal-day'];
            if(year===now.getFullYear() && month===now.getMonth() && d===now.getDate()) cls.push('today');
            if(marked.has(d)) cls.push('mark');
            html += `<div class="${cls.join(' ')}">${d}</div>`;
          }
          const totalCells = leading + daysInMonth;
          const trailing = (7 - (totalCells % 7)) % 7;
          for(let d=1; d<=trailing; d++){ html += `<div class="cal-day other">${d}</div>`; }
          grid.innerHTML = html;
        }

        // Actualiza el texto del widget "Corte semanal" (fecha del próximo corte y "En N días"/"Hoy"/"Mañana")
        // con la hora real del navegador. El resto del texto (reglas, conteos) queda como está.
        function renderCorteSemanal(){
          const now = new Date();
          const cutoff = nextWeeklyCutoff(now);
          const label = formatCutoffLabel(cutoff);
          const diasLabel = daysUntilLabel(cutoff, now);
          root.querySelectorAll('.corte-time').forEach(el => { el.textContent = label; });
          root.querySelectorAll('.corte-sub').forEach(el => {
            el.innerHTML = el.innerHTML.replace(/^(Hoy|Mañana|En \d+ días)\.?/, `${diasLabel}.`);
          });
        }

        function goPage(name, tabRef){
          root.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
          root.getElementById('page-'+name).classList.add('active');
          root.querySelectorAll('.pill-nav button').forEach(t=>{ t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
          const tabEl = typeof tabRef === 'number' ? root.querySelectorAll('.pill-nav button')[tabRef] : tabRef;
          if(tabEl){ tabEl.classList.add('active'); tabEl.setAttribute('aria-selected','true'); }
          window.scrollTo(0,0);
        }

        window.AnalistaApp = {goPage, renderWorkers, selectWorker, selectPrograma, toggleCurso, submitSolicitud, resetFlow, filterHist, filterHome, rowKey, updateSummary, onSessionReady, loadPersonal, loadCursos, loadMisSolicitudes, toggleNotif, hideToast};

        renderWorkers();
        renderHist('todas');
        renderHomeActivity('todas');
        renderCalendar();
        renderCorteSemanal();
        refreshCounts();

        // Si la pestaña queda abierta, refresca el calendario y el corte semanal cada minuto para que
        // "hoy" y la cuenta regresiva sigan siendo correctos aunque cambie el día o pase la hora de corte.
        setInterval(() => { renderCalendar(); renderCorteSemanal(); }, 60000);

    })(root);
  }
}

          const firstOfMonth = new Date(year, month, 1);
          const leading = (firstOfMonth.getDay() + 6) % 7;
          const daysInMonth = new Date(year, month + 1, 0).getDate();
